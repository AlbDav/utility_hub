[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.4"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Il service worker non va mai in cache HTTP, così gli aggiornamenti arrivano subito.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
